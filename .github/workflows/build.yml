# Compile HN Mail pour Mac (Apple Silicon + Intel) et Windows, puis publie les deux dans une Release.
name: Build HN Mail

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilation
        run: swift build -c release --arch arm64 --arch x86_64
      - name: Application
        run: |
          VERSION=$(cat VERSION)
          BIN=$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)
          APP="dist/HN Mail.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "$BIN/HNMail" "$APP/Contents/MacOS/HNMail"
          sed -e "s/__VERSION__/$VERSION/" -e "s/__BUILD__/${{ github.run_number }}/" packaging/Info.plist > "$APP/Contents/Info.plist"
          printf 'APPL????' > "$APP/Contents/PkgInfo"
          ICONSET=dist/AppIcon.iconset
          mkdir -p "$ICONSET"
          for s in 16 32 128 256 512; do
            sips -z $s $s packaging/icon-1024.png --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
            d=$((s*2)); sips -z $d $d packaging/icon-1024.png --out "$ICONSET/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/AppIcon.icns"
          codesign --force --deep --sign - "$APP"
          mkdir -p dist/dmg && cp -R "$APP" dist/dmg/ && ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "HN Mail" -srcfolder dist/dmg -ov -format UDZO "dist/HN-Mail.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/HN-Mail.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compilation
        shell: pwsh
        run: |
          $version = (Get-Content VERSION).Trim()
          dotnet publish windows/HNMail/HNMail.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true `
            -p:Version=$version -p:FileVersion="$version.${{ github.run_number }}" -o out
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "out/HN Mail.exe" "dist/HN-Mail-Windows.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/HN-Mail-Windows.exe

  release:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(cat VERSION)
          TAG="v${VERSION}-build${{ github.run_number }}"
          gh release create "$TAG" dist/mac/HN-Mail.dmg dist/windows/HN-Mail-Windows.exe \
            --title "HN Mail ${VERSION} (build ${{ github.run_number }})" --latest \
            --notes "Mac : ouvre HN-Mail.dmg et glisse HN Mail dans Applications (premier lancement : clic droit › Ouvrir).
          Windows : lance HN-Mail-Windows.exe (si Windows affiche « PC protégé » : Informations complémentaires › Exécuter quand même)."
